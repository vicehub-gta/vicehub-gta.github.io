name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  ping-search-engines:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tell Bing/Yandex/Seznam about new pages (IndexNow)
        run: |
          KEY=$(python3 -c "import json;print(json.load(open('site.json')).get('indexnow_key',''))")
          [ -z "$KEY" ] && exit 0
          python3 - "$KEY" <<'PY'
          import json, sys, re, subprocess, pathlib
          key = sys.argv[1]
          cfg = json.load(open("site.json"))
          origin = cfg["origin"].rstrip("/")
          slugs = [json.load(open(p))["slug"] for p in pathlib.Path("content/articles").glob("*.json")]
          paths = ["/", "/map/", "/buy/", "/premium/", "/community/"] + [f"/a/{s}/" for s in slugs]
          urls = [origin + p for p in paths] + [origin + "/de" + p for p in paths]
          body = json.dumps({"host": origin.split("//")[1], "key": key, "keyLocation": f"{origin}/{key}.txt", "urlList": urls})
          r = subprocess.run(["curl", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "-X", "POST", "https://api.indexnow.org/indexnow",
                              "-H", "Content-Type: application/json; charset=utf-8", "-d", body], capture_output=True, text=True)
          print("IndexNow status", r.stdout, r.stderr)
          PY
